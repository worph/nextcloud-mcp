services:
  nextcloudmcp:
    build: .
    container_name: nextcloud-mcp
    hostname: nextcloudmcp
    ports:
      - "9650:9650"
      # UDP 9099 is only published on the mcp-net Docker network so the Beacon
      # aggregator can reach us. Host-side publishing is omitted to avoid
      # conflicts with other MCPs on the same host.
    volumes:
      - ./data:/app/wrapper-data:rw
    environment:
      - NODE_ENV=production
      - PORT=9650
      - UPSTREAM_PORT=8000
      - DISCOVERY_PORT=9099
      # Optional — pre-seed on first boot; the Web UI can override afterwards.
      # - NEXTCLOUD_HOST=http://nextcloud:80
      # - NEXTCLOUD_USERNAME=
      # - NEXTCLOUD_PASSWORD=
    restart: unless-stopped
    networks:
      - mcp-net

networks:
  mcp-net:
    external: true
