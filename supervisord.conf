[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nextcloud-mcp-upstream]
command=/bin/sh -c 'set -a; . "$UPSTREAM_ENV_PATH" 2>/dev/null || exit 0; set +a; exec /app/.venv/bin/nextcloud-mcp-server run --transport streamable-http --host 127.0.0.1 --port %(ENV_UPSTREAM_PORT)s'
directory=/app
autostart=false
autorestart=true
startsecs=3
startretries=10
priority=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wrapper]
command=node /wrapper/dist/index.js
directory=/wrapper
autostart=true
autorestart=true
priority=2
environment=CONFIG_PATH="/app/wrapper-data/config.json",UPSTREAM_ENV_PATH="/tmp/upstream.env",PORT="9650",UPSTREAM_PORT="8000",DISCOVERY_PORT="9099"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
